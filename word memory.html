<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>单词背诵 · 多单元版</title>
<style>
  .word-meta{
  font-size:15px;color:var(--muted);margin:-12px 0 18px;
  letter-spacing:.2px;line-height:1.6;
  }
  .dark .word-meta{color:#aaa;}
  :root{
    --primary:#4f46e5;
    --primary2:#7c3aed;
    --pink:#db2777;
    --text:#1f2937;
    --muted:#6b7280;
    --card:#ffffff;
    --border:#e6e8f0;
    --shadow-sm:0 4px 14px rgba(31,41,55,.06);
    --shadow-md:0 14px 34px rgba(31,41,55,.10);
    --shadow-lg:0 26px 60px rgba(79,70,229,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;}
  body{
    min-height:100vh;color:var(--text);padding:24px;
    background:
      radial-gradient(1100px 620px at 10% -10%, rgba(99,102,241,.18), transparent 55%),
      radial-gradient(900px 520px at 96% 0%, rgba(236,72,153,.14), transparent 50%),
      radial-gradient(900px 620px at 50% 115%, rgba(6,182,212,.14), transparent 55%),
      #f4f6fc;
    transition:background .45s,color .45s;
  }
  body.dark{
    color:#e9ebf3;
    background:
      radial-gradient(1100px 620px at 10% -10%, rgba(99,102,241,.22), transparent 55%),
      radial-gradient(900px 520px at 96% 0%, rgba(236,72,153,.16), transparent 50%),
      radial-gradient(900px 620px at 50% 115%, rgba(6,182,212,.16), transparent 55%),
      #0e1016;
  }
  /* 背诵内容在屏幕正中央，侧边栏固定在左侧不动 */
  .app{position:relative;width:100%;}
  .sidebar{
  width:250px;flex-shrink:0;background:#fff;border-radius:18px;padding:18px;
  box-shadow:var(--shadow-md);position:fixed;top:100px;left:24px;z-index:20;
  max-height:calc(100vh - 96px);overflow:auto;   /* 下移后防止底部超出视口 */
  transition:box-shadow .35s,transform .35s;
  }
  .dark .sidebar{background:#1e1e1e;box-shadow:0 8px 30px rgba(0,0,0,.45);}
  .sidebar h2{font-size:18px;margin-bottom:12px;}
  .sidebar label{display:block;font-size:13px;color:#666;margin:14px 0 6px;}
  .dark .sidebar label{color:#aaa;}
  .sidebar select{width:100%;padding:9px 10px;border-radius:10px;border:1px solid #d1d5db;background:#fff;color:#222;font-size:15px;outline:none;transition:.2s;}
  .sidebar select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.15);}
  .dark .sidebar select{background:#2d2d2d;color:#eee;border-color:#4a4f5a;}
  .unit-info{margin-top:16px;font-size:13px;color:#666;line-height:1.7;}
  .dark .unit-info{color:#aaa;}
  .container{max-width:760px;margin:0 auto;padding:8px 4px 70px;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .title{font-size:25px;font-weight:800;letter-spacing:.6px;
    background:linear-gradient(120deg,var(--primary),var(--primary2) 55%,var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .toggle-dark{padding:9px 14px;border-radius:999px;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.85);color:var(--text);cursor:pointer;font-size:14px;font-weight:600;box-shadow:var(--shadow-sm);transition:.25s;}
  .toggle-dark:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  body.dark .toggle-dark{background:rgba(45,48,58,.85);border-color:rgba(255,255,255,.1);color:#e9ebf3;}
  .progress{margin-bottom:18px;font-size:14px;color:var(--muted);}
  .progress-bar{height:12px;background:rgba(148,163,184,.32);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.08);}
  .progress-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#22c55e,#16a34a);transition:width .4s ease;position:relative;overflow:hidden;}
  .progress-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:shine 2.2s infinite;}
  @keyframes shine{100%{transform:translateX(100%);}}
  .slider-area{margin-bottom:14px;}
  #wordSlider{width:100%;-webkit-appearance:none;appearance:none;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--primary2));outline:none;cursor:pointer;}
  #wordSlider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--primary);box-shadow:0 3px 8px rgba(0,0,0,.28);transition:transform .15s;}
  #wordSlider::-webkit-slider-thumb:hover{transform:scale(1.18);}
  #wordSlider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--primary);box-shadow:0 3px 8px rgba(0,0,0,.28);cursor:pointer;}
  .current-pos{margin-bottom:12px;font-size:15px;color:var(--muted);text-align:center;}
  .card{position:relative;overflow:hidden;background:var(--card);border-radius:22px;padding:48px 34px;box-shadow:var(--shadow-md);border:1px solid var(--border);text-align:center;min-height:300px;display:flex;flex-direction:column;justify-content:center;transition:transform .35s,box-shadow .35s;}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--primary),var(--primary2),var(--pink));}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
  .dark .card{background:#171922;}
  .word-en{font-size:38px;font-weight:800;margin-bottom:22px;word-break:break-word;line-height:1.25;letter-spacing:.4px;}
  .word-cn{font-size:19px;color:var(--muted);min-height:60px;line-height:1.7;padding:0 6px;}
  .dark .word-cn{color:#bbb;}
  .spelling-area{margin-top:30px;}
  .spelling-meta{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:16px;font-size:15px;color:var(--muted);flex-wrap:wrap;}
  .dark .spelling-meta{color:#aaa;}
  .spelling-row {display: flex;flex-wrap: wrap; justify-content: center;align-items: center;gap: 12px; /* 单词之间的间距 */width: 100%;padding: 0 10px; /* 左右留出一点安全边距 */}
  /* 单个单词的容器，强制内部不换行，最大宽度不超过父容器 */
  .word-group {display: flex;flex-wrap: nowrap; gap: 6px; /* 字母之间的间距 */justify-content: center;max-width: 100%; /* 关键：防止超长单词撑破容器 */}
  /* 字母格子：默认 48px，空间不够时允许收缩，但不允许放大 */
  .letter-cell {flex: 0 1 48px; min-width: 14px; /* 极限压缩到多小，防止完全挤没 */display: flex;}
  /* 输入框：宽度 100% 跟随父容器，并解除 input 的最小宽度限制 */
  .letter-cell input {width: 100%;min-width: 0; /* 最核心的一步：允许 input 突破浏览器默认最小宽度 */height: 58px;padding: 0;text-align: center;font-size: 24px; /* 字体稍微调小一点，防止在窄框里溢出 */font-weight: 700;font-family: inherit;text-transform: lowercase;color: inherit;border: 2px solid #d7dbe6;border-bottom-width: 4px;border-radius: 10px;background: #fff;outline: none;-webkit-appearance: none;appearance: none;box-shadow: 0 3px 6px rgba(0,0,0,.05);transition: .15s;}  /* 移动端适配 */
  @media(max-width: 820px) {.letter-cell { width: 38px; min-width: 20px; }.letter-cell input { height: 52px; font-size: 22px; }} 
  .letter-cell input:focus{border-color:var(--primary);background:#eef2ff;box-shadow:0 0 0 4px rgba(79,70,229,.15);}
  .dark .letter-cell input:focus{background:#2a2f3d;}
  .letter-cell.correct input{border-color:#16a34a;background:#f0fdf4;color:#15803d;box-shadow:0 0 0 4px rgba(22,163,74,.12);}
  .dark .letter-cell.correct input{background:#14271d;}
  .letter-cell.wrong input{border-color:#dc2626;background:#fef2f2;color:#b91c1c;box-shadow:0 0 0 4px rgba(220,38,38,.12);animation:shake .3s;}
  .dark .letter-cell.wrong input{background:#2a1414;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .fixed-cell {display: inline-flex;align-items: center;justify-content: center;min-width: 14px;height: 58px;font-size: 24px;font-weight: 700;color: #9ca3af;user-select: none;} 
  .spelling-check{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;color:white;background:#9ca3af;opacity:0;transform:scale(.4);transition:.3s;}
  .spelling-check.show{opacity:1;transform:scale(1);background:#16a34a;box-shadow:0 2px 8px rgba(22,163,74,.5);}
  .hidden-cn{color:transparent;}
  .hidden-en{color:transparent;}
  .btns{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;}
  button{padding:11px 18px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.08);transition:transform .15s,filter .15s,box-shadow .15s;}
  button:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 10px 22px rgba(0,0,0,.16);}
  button:active{transform:translateY(0) scale(.98);}
  button:focus-visible{outline:3px solid rgba(79,70,229,.55);outline-offset:2px;}
  kbd{display:inline-block;padding:2px 8px;border-radius:8px;background:rgba(148,163,184,.28);border:1px solid rgba(0,0,0,.12);border-bottom-width:2px;font-family:inherit;font-size:12px;color:inherit;}
  .dark kbd{background:rgba(148,163,184,.2);border-color:rgba(255,255,255,.14);color:#dfe3ee;}
  .spelling-area.hidden-spelling{display:none;}
  .btn-spell.hidden{display:none;}
  .spelling-hint{margin-top:16px;font-size:13px;color:#8a909c;text-align:center;}
  .dark .spelling-hint{color:#7d8595;}
  .card .hidden-cn,.card .hidden-en{color:transparent !important;-webkit-text-fill-color:transparent;}
  .btn-blue{background:linear-gradient(135deg,#3b82f6,#4f46e5);color:#fff;}
  .btn-green{background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;}
  .btn-gray{background:linear-gradient(135deg,#a1a8b8,#6b7280);color:#fff;}
  .btn-red{background:linear-gradient(135deg,#f87171,#dc2626);color:#fff;}
  .btn-orange{background:linear-gradient(135deg,#fb923c,#f97316);color:#fff;}
  .btn-pink{background:linear-gradient(135deg,#f472b6,#db2777);color:#fff;}
  .fav-book{margin:42px auto 0;max-width:560px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:var(--shadow-sm);}
  .dark .fav-book{background:#171922;}
  .fav-book h3{margin-bottom:14px;font-size:16px;font-weight:700;}
  .fav-item{padding:9px 12px;margin:6px 0;background:#f3f4f6;border-radius:10px;cursor:pointer;transition:.2s;}
  .dark .fav-item{background:#21242e;}
  .fav-item:hover{opacity:.85;transform:translateX(3px);}
  .empty-fav{color:#888;font-size:14px;}
  /* 响应式：窄屏时侧边栏移到顶部，内容在下方居中，避免与侧边栏重叠 */
  @media(max-width:1300px){
    .app{display:flex;flex-direction:column;align-items:center;}
    .sidebar{position:static;width:100%;max-width:460px;margin:0 auto 24px;}
    .container{width:100%;max-width:760px;padding:0 4px 60px;}
  }
  @media(max-width:820px){
    body{padding:14px;}
    .card{padding:34px 18px;min-height:280px;}
    .word-en{font-size:30px;}
    .word-cn{font-size:17px;}
    .letter-cell input{width:40px;height:52px;font-size:22px;}
    .fav-book{max-width:100%;}
    .btns button{flex:1 1 auto;}
    .letter-cell { flex: 0 1 38px; } 
    .letter-cell input { height: 52px; font-size: 20px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h2>📚 选择背诵内容</h2>
    <label for="bookSelect">课本</label>
    <select id="bookSelect"></select>
    <label for="unitSelect">单元</label>
    <select id="unitSelect"></select>
    <div class="unit-info" id="unitInfo">--</div>
  </aside>

  <main class="container">
    <header>
      <div class="title">单词卡背诵</div>
      <button class="toggle-dark" onclick="toggleDark()">🌓 深色模式</button>
    </header>

    <div class="slider-area">
      <input type="range" id="wordSlider" min="1" value="1">
    </div>

    <div class="current-pos" id="currentPos">当前：第 1 / 0 个单词</div>

    <div class="progress">
      <div>进度：<span id="progressText">0 / 0</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="card">
      <div class="word-en" id="en">--</div>
      <div class="word-meta" id="meta"></div>
      <div class="word-cn" id="cn">--</div>
      <div class="spelling-area" id="spellingArea">
        <div class="spelling-meta">
          <span>共 <b id="spellingTotal">0</b> 个字母</span>
          <span>·</span>
          <span>已填对 <b id="spellingDone">0</b> 个</span>
          <span class="spelling-check" id="spellingCheck"></span>
        </div>
        <div class="spelling-row" id="spellingRow"></div>
        <div class="spelling-hint">全部填对后按 <kbd>Enter</kbd> 自动进入下一个单词</div>
      </div>
    </div>

    <div class="btns">
      <button class="btn-gray" onclick="prevWord()">上一个</button>
      <button class="btn-blue" onclick="showCn()">显示释义</button>
      <button class="btn-orange" onclick="toggleMaskMode()">切换模式</button>
      <button class="btn-blue" onclick="nextWord()">下一个</button>
      <button class="btn-gray btn-spell" onclick="clearSpelling()">🧹 清空拼写</button>
      <button class="btn-green" onclick="knowIt()">✅ 记住了</button>
      <button class="btn-pink" onclick="toggleFavorite()">⭐ 收藏</button>
      <button class="btn-red" onclick="resetAll()">重置全部</button>
    </div>

    <div class="fav-book">
      <h3>⭐ 收藏本</h3>
      <div id="favList" class="fav-list"></div>
    </div>
  </main>
</div>

/* ==================== 状态 ==================== */
let wordList = [];
let currentBook = "";
let currentUnit = "";
let currentUnitKey = "";
let currentIndex = 0;
let knownByUnit = {};
let known = new Set();
let favoriteSet = new Set();
try {
  const savedFavs = localStorage.getItem("word_app_favorites");
  if (savedFavs) {
    favoriteSet = new Set(JSON.parse(savedFavs));
  }
} catch (e) {
  console.error("读取收藏失败", e);
}
let maskMode = 0; // 0=遮蔽中文(看英文想中文), 1=遮蔽英文(看中文想英文)
const spellingData = {};

const slider = document.getElementById("wordSlider");
const bookSelect = document.getElementById("bookSelect");
const unitSelect = document.getElementById("unitSelect");
const unitInfo = document.getElementById("unitInfo");

/* ==================== 侧边栏与单元加载 ==================== */
function initSidebar() {
  const books = Object.keys(wordBank);
  bookSelect.innerHTML = books.map(b => `<option value="${b}">${b}</option>`).join("");
  bookSelect.value = books[0];
  updateUnitOptions();
  const firstBook = bookSelect.value;
  const firstUnit = Object.keys(wordBank[firstBook])[0];
  unitSelect.value = firstUnit;
  loadUnit(firstBook, firstUnit, 0);
}

function updateUnitOptions() {
  const book = bookSelect.value;
  const units = Object.keys(wordBank[book]);
  unitSelect.innerHTML = units.map(u => `<option value="${u}">${u}</option>`).join("");
}

bookSelect.addEventListener("change", function () {
  updateUnitOptions();
  const book = bookSelect.value;
  const unit = unitSelect.value;
  loadUnit(book, unit, 0);
});

unitSelect.addEventListener("change", function () {
  loadUnit(bookSelect.value, unitSelect.value, 0);
});

function loadUnit(book, unit, index) {
  currentBook = book;
  currentUnit = unit;
  currentUnitKey = book + "|" + unit;
  wordList = wordBank[book][unit].map(([en, cn]) => ({ en, cn }));
  currentIndex = Math.max(0, Math.min(Number(index) || 0, wordList.length - 1));
  if (!knownByUnit[currentUnitKey]) knownByUnit[currentUnitKey] = new Set();
  known = knownByUnit[currentUnitKey];
  slider.max = Math.max(1, wordList.length);
  slider.value = currentIndex + 1;
  bookSelect.value = book;
  unitSelect.value = unit;
  unitInfo.innerHTML = `当前：<b>${book} · ${unit}</b><br>共 ${wordList.length} 个词条（含词组）`;
  render();
}

slider.addEventListener("input", function () {
  currentIndex = Number(slider.value) - 1;
  render();
});

/* ==================== 渲染 ==================== */
function render() {
  if (!wordList.length) return;
  const w = wordList[currentIndex];
  const elEn = document.getElementById("en");
  const elCn = document.getElementById("cn");
  elEn.innerText = w.en;
  elCn.innerText = w.cn;
  const meta = wordMeta[w.en] || ["", ""];
  const elMeta = document.getElementById("meta");
  elMeta.innerText = [meta[0], meta[1]].filter(Boolean).join("  ");

  if (maskMode === 0) {
    elCn.classList.add("hidden-cn");
    elEn.classList.remove("hidden-en");
    elMeta.classList.remove("hidden-en");
  } else {
    elEn.classList.add("hidden-en");
    elCn.classList.remove("hidden-cn");
    elMeta.classList.add("hidden-en");
  }

  document.getElementById("currentPos").innerText = `当前：第 ${currentIndex + 1} / ${wordList.length} 个单词`;
  slider.value = currentIndex + 1;
  updateProgress();

  const favBtn = document.querySelector(".btn-pink");
  if (favoriteSet.has(favoriteKey())) {
    favBtn.innerText = "⭐ 已收藏";
  } else {
    favBtn.innerText = "⭐ 收藏";
  }

  updateKnowButton();

  const spellingArea = document.getElementById("spellingArea");
  spellingArea.classList.toggle("hidden-spelling", maskMode !== 1);
  document.querySelector(".btn-spell").classList.toggle("hidden", maskMode !== 1);

  renderFavoriteList();
  renderSpelling();
}

function updateProgress() {
  const total = wordList.length || 1;
  document.getElementById("progressText").innerText = known.size + " / " + wordList.length;
  document.getElementById("progressFill").style.width = (known.size / total * 100) + "%";
}

function updateKnowButton() {
  const btn = document.querySelector(".btn-green");
  if (btn) btn.innerText = known.has(currentIndex) ? "✅ 已记住" : "✅ 记住了";
}

function favoriteKey(idx = currentIndex) {
  return `${currentBook}|${currentUnit}|${idx}`;
}

function spellKey() {
  return `${currentUnitKey}|${currentIndex}`;
}

/* ==================== 收藏本 ==================== */
function renderFavoriteList() {
  const favDom = document.getElementById("favList");
  if (favoriteSet.size === 0) {
    favDom.innerHTML = `<div class="empty-fav">暂无收藏的单词</div>`;
    return;
  }
  let html = "";
  for (let key of favoriteSet) {
    const [book, unit, idxStr] = key.split("|");
    const idx = Number(idxStr);
    const item = wordBank[book] && wordBank[book][unit] && wordBank[book][unit][idx];
    if (!item) continue;
    html += `<div class="fav-item" onclick="jumpToFavorite('${key}')">
      <strong>${item[0]}</strong> — ${item[1]}
      <span style="font-size:12px;color:#888;">（${book} ${unit}）</span>
    </div>`;
  }
  favDom.innerHTML = html || `<div class="empty-fav">暂无收藏的单词</div>`;
}

function jumpToFavorite(key) {
  const [book, unit, idxStr] = key.split("|");
  loadUnit(book, unit, Number(idxStr));
}

function toggleFavorite() {
  const key = favoriteKey();
  if (favoriteSet.has(key)) favoriteSet.delete(key);
  else favoriteSet.add(key);
  
  // 实时保存到 localStorage
  localStorage.setItem("word_app_favorites", JSON.stringify(Array.from(favoriteSet)));
  
  render();
}

/* ==================== 功能按钮 ==================== */
function showCn() {
  const elEn = document.getElementById("en");
  const elCn = document.getElementById("cn");
  const elMeta = document.getElementById("meta");
  if (maskMode === 0) {
    elCn.classList.toggle("hidden-cn");
  } else {
    elEn.classList.toggle("hidden-en");
    elMeta.classList.toggle("hidden-en");
  }
}

function toggleMaskMode() {
  maskMode = maskMode === 0 ? 1 : 0;
  render();
}

function nextWord() {
  currentIndex = (currentIndex + 1) % wordList.length;
  render();
  if (isSpellingMode()) focusFirstLetter();
}

function prevWord() {
  currentIndex = (currentIndex - 1 + wordList.length) % wordList.length;
  render();
}

function knowIt() {
  known.add(currentIndex);
  nextWord();
}

function resetAll() {
  knownByUnit = {};
  known = new Set();
  knownByUnit[currentUnitKey] = known;
  
  favoriteSet.clear();
  localStorage.removeItem("word_app_favorites"); // 清空本地收藏缓存
  
  for (const k in spellingData) delete spellingData[k];
  currentIndex = 0;
  maskMode = 0;
  render();
}

function toggleDark() {
  document.body.classList.toggle("dark");
}

/* ==================== 拼写填空 ==================== */
function getLetters(idx) {
  return wordList[idx].en.split("").filter(ch => /[A-Za-z]/.test(ch)).map(ch => ch.toLowerCase());
}

function buildTokens(en) {
  const tokens = [];
  for (const ch of en) {
    if (/[A-Za-z]/.test(ch)) {
      tokens.push({ type: "input" });
    } else if (ch.trim() === "") {
      tokens.push({ type: "fixed", ch: " " });
    } else {
      tokens.push({ type: "fixed", ch });
    }
  }
  return tokens;
}

function escapeHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function renderSpelling() {
  const row = document.getElementById("spellingRow");
  const w = wordList[currentIndex];
  const tokens = buildTokens(w.en);
  const letters = getLetters(currentIndex);
  const key = spellKey();
  const typed = spellingData[key] ? spellingData[key].slice() : new Array(letters.length).fill("");

  let html = "";
  let li = 0;
  let currentWordHtml = ""; // 暂存当前单词的 HTML

  for (const t of tokens) {
    // 如果遇到空格，说明一个单词结束，打包进 word-group
    if (t.type === "fixed" && t.ch === " ") {
      if (currentWordHtml) {
        html += `<div class="word-group">${currentWordHtml}</div>`;
        currentWordHtml = "";
      }
      continue; // 不再渲染原来的圆点，改为用 CSS gap 区分
    } 
    
    // 其他固定字符（如连字符 -）
    if (t.type === "fixed") {
      currentWordHtml += `<span class="fixed-cell">${escapeHtml(t.ch)}</span>`;
    } 
    // 字母输入框
    else {
      const val = typed[li] || "";
      const cls = val === "" ? "" : (String(val).toLowerCase() === letters[li] ? "correct" : "wrong");
      currentWordHtml += `<div class="letter-cell ${cls}"><input maxlength="1" autocomplete="off" autocapitalize="off" spellcheck="false" data-li="${li}" value="${escapeHtml(val)}"></div>`;
      li++;
    }
  }
  
  // 把最后剩下的单词组也加进去
  if (currentWordHtml) {
    html += `<div class="word-group">${currentWordHtml}</div>`;
  }

  row.innerHTML = html;
  updateSpellMeta();
}

function updateSpellMeta() {
  const letters = getLetters(currentIndex);
  const typed = spellingData[spellKey()] || new Array(letters.length).fill("");
  let correctCount = 0;
  for (let i = 0; i < letters.length; i++) {
    if (String(typed[i] || "").toLowerCase() === letters[i]) correctCount++;
  }
  document.getElementById("spellingTotal").innerText = letters.length;
  document.getElementById("spellingDone").innerText = correctCount;

  const allRight = isSpellingComplete();
  if (allRight && !known.has(currentIndex)) {
    known.add(currentIndex);
    updateProgress();
    updateKnowButton();
  }
  document.getElementById("spellingCheck").classList.toggle("show", allRight);
}

function isSpellingComplete() {
  const letters = getLetters(currentIndex);
  if (letters.length === 0) return false;
  const typed = spellingData[spellKey()] || [];
  return typed.length === letters.length && typed.every((c, i) => String(c || "").toLowerCase() === letters[i]);
}

function isSpellingMode() {
  return maskMode === 1;
}

document.getElementById("spellingRow").addEventListener("input", function (e) {
  const inp = e.target;
  if (!inp || !inp.matches || !inp.matches("input")) return;
  const li = Number(inp.dataset.li);
  const letters = getLetters(currentIndex);
  if (li < 0 || li >= letters.length) return;

  const clean = inp.value.toLowerCase().replace(/[^a-z]/g, "");
  if (inp.value !== clean) inp.value = clean;

  const key = spellKey();
  if (!spellingData[key]) spellingData[key] = new Array(letters.length).fill("");
  spellingData[key][li] = clean;

  const cell = inp.closest(".letter-cell");
  cell.classList.remove("correct", "wrong");
  if (clean === letters[li]) cell.classList.add("correct");
  else if (clean !== "") cell.classList.add("wrong");

  updateSpellMeta();

  if (clean === letters[li]) {
    const inputs = Array.from(document.querySelectorAll("#spellingRow input"));
    if (li < inputs.length - 1) {
      inputs[li + 1].focus();
    }
  }
});

document.getElementById("spellingRow").addEventListener("keydown", function (e) {
  const inp = e.target;
  if (!inp || !inp.matches || !inp.matches("input")) return;
  if (e.key === "Backspace" && inp.value === "") {
    e.preventDefault();
    const inputs = Array.from(document.querySelectorAll("#spellingRow input"));
    const i = Number(inp.dataset.li);
    if (i > 0 && inputs[i - 1]) inputs[i - 1].focus();
  }
});

document.addEventListener("keydown", function (e) {
  if (e.key !== "Enter") return;
  const active = document.activeElement;
  if (active && (active.tagName === "BUTTON" || active.tagName === "TEXTAREA")) return;
  if (!isSpellingMode()) return;
  if (!isSpellingComplete()) return;
  e.preventDefault();
  nextWord();
});

function focusFirstLetter() {
  const first = document.querySelector("#spellingRow input");
  if (first) first.focus();
}

function clearSpelling() {
  delete spellingData[spellKey()];
  renderSpelling();
  focusFirstLetter();
}

/* ==================== 启动 ==================== */
initSidebar();
</script>
